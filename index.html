<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>LiftLog · interactive preview</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#071619">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      /* Retinted from a stormy teal/navy reference photo — deep near-black teal base, a bright
         cyan-teal primary accent, bolder/more visible borders per the "techy, bold, bordered"
         brief. Variable names kept as --ember/etc. to avoid touching ~150 call sites; only the
         values changed. The ambient background additionally hue-shifts through the day (see
         TIME_OF_DAY_PALETTES in the script) — cyan mornings, deep purple/blue nights. */
      --bg: #071619;
      --shell: #0a1a1e;
      --surface: #0f262b;
      --surface-2: #163239;
      --surface-3: #1e3f47;
      --line: #2d4d55;
      --line-soft: #1c343b;
      --text: #eef4f3;
      --text-dim: #c3d4d2;
      --muted: #86a4a2;
      --muted-2: #4d6d6d;

      --ember: #4fd1c5;
      --ember-2: #7fe3da;
      --ember-ink: #032220;
      --ember-soft: rgba(79, 209, 197, .18);
      --mint: #34e0a1;
      --mint-ink: #04241a;
      --mint-soft: rgba(52, 224, 161, .16);
      --sky: #5b9fe3;
      --sky-soft: rgba(91, 159, 227, .18);
      --violet: #8b7fe8;
      --violet-soft: rgba(139, 127, 232, .18);
      --amber: #ffb648;
      --rose: #d1709e;
      --danger: #ff6b6b;

      --r-sm: 12px;
      --r-md: 16px;
      --r-lg: 22px;
      --r-xl: 28px;

      --ease-out: cubic-bezier(.16,1,.3,1);
      --ease-spring: cubic-bezier(.34,1.56,.64,1);
      --ease-standard: cubic-bezier(.4,0,.2,1);

      --shadow-sm: 0 1px 2px rgba(0,0,0,.5);
      --shadow-md: 0 10px 28px -12px rgba(0,0,0,.6);
      --shadow-lg: 0 24px 56px -20px rgba(0,0,0,.7);
      --shadow-ember: 0 14px 32px -12px rgba(79,209,197,.4);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { color: var(--text); display: flex; justify-content: center; }
    button, input, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }
    .disp { font-family: 'Barlow Condensed', 'Inter', sans-serif; font-weight: 700; letter-spacing: -.01em; }
    .ic { width: 20px; height: 20px; display: block; flex: none; }
    .ic-sm { width: 15px; height: 15px; }
    .ic-lg { width: 26px; height: 26px; }

    .app-shell { width: min(100%, 430px); min-height: 100vh; background: var(--shell); box-shadow: 0 0 0 1px #1c2027, var(--shadow-lg); position: relative; overflow: hidden; isolation: isolate; }
    /* Ambient animated gradient, drawn once behind everything (never recreated by render()'s
       innerHTML swap, since it lives outside #app). Canvas 2D radial-gradient blobs rather than a
       WebGL/Three.js shader pipeline — this stays a dependency-free static file — but genuinely
       animated and GPU-composited, not a static CSS blob. See initGradientBackground(). */
    #shader-bg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; opacity: .32; filter: blur(6px); }
    #app { position: relative; z-index: 1; min-height: 100%; }
    .screen { min-height: 100vh; padding-bottom: 100px; position: relative; overflow: hidden; }
    .scroll { max-height: 100vh; overflow-y: auto; padding: 22px 18px 32px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
    .glow { position: absolute; top: -120px; right: -80px; width: 280px; height: 280px; border-radius: 50%; background: radial-gradient(circle, var(--glow-a, var(--ember-soft)), transparent 70%); filter: blur(30px); pointer-events: none; z-index: 0; animation: glow-drift 17s ease-in-out infinite; }
    @keyframes glow-drift { 0%, 100% { transform: translate(0, 0) scale(1); opacity: 1; } 50% { transform: translate(-26px, 20px) scale(1.15); opacity: .85; } }
    /* Second ambient blob, mood-colored — invisible (transparent fallback) until a sky mood sets --glow-b */
    .screen::before { content: ""; position: absolute; width: 240px; height: 240px; border-radius: 50%; left: -70px; bottom: -50px; background: radial-gradient(circle, var(--glow-b, transparent), transparent 70%); filter: blur(50px); pointer-events: none; z-index: 0; animation: glow-drift-2 21s ease-in-out infinite; }
    @keyframes glow-drift-2 { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(24px, -18px) scale(1.18); } }
    :root[data-sky="morning"] { --glow-a: rgba(79, 209, 197, .34); --glow-b: rgba(127, 227, 218, .22); }
    :root[data-sky="day"] { --glow-a: rgba(79, 209, 197, .28); --glow-b: rgba(91, 159, 227, .2); }
    :root[data-sky="evening"] { --glow-a: rgba(91, 140, 180, .32); --glow-b: rgba(110, 90, 170, .26); }
    :root[data-sky="night"] { --glow-a: rgba(90, 60, 180, .32); --glow-b: rgba(50, 40, 120, .28); }
    /* Real weather (opt-in): overrides the time-of-day mood above while active. Sunny gets an
       actual sun disc, rainy gets a blurred falling-streak overlay, cloudy stays flat and grey. */
    :root[data-weather] .app-shell::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0; }
    :root[data-weather="sunny"] .app-shell::after {
      background: radial-gradient(120px 120px at 82% 12%, rgba(255, 224, 140, .9), rgba(255, 214, 120, .35) 45%, transparent 70%);
      filter: blur(2px);
      animation: sun-pulse 6s ease-in-out infinite;
    }
    @keyframes sun-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .82; } }
    :root[data-weather="rainy"] .app-shell::after {
      background-image: repeating-linear-gradient(100deg, rgba(200, 220, 255, .16) 0 2px, transparent 2px 22px);
      filter: blur(1px);
      opacity: .5;
      animation: rain-fall 0.6s linear infinite;
    }
    @keyframes rain-fall { from { background-position: 0 0; } to { background-position: -40px 90px; } }
    :root[data-weather="cloudy"] .app-shell::after {
      background: linear-gradient(160deg, rgba(140, 155, 175, .18), transparent 60%);
    }
    .topline { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; position: relative; z-index: 1; }
    .topline-copy { flex: 1; }
    .eyebrow { color: var(--ember); font-size: 11px; line-height: 1.2; letter-spacing: .12em; font-weight: 800; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 34px; letter-spacing: -.01em; line-height: 1.04; margin-top: 8px; }
    h2 { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 25px; letter-spacing: -.01em; }
    h3 { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
    .subtle { color: var(--muted); font-size: 13px; }
    .cloud-pill, .tag, .previous { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; white-space: nowrap; }
    .cloud-pill { color: var(--text-dim); background: var(--surface-2); border: 1px solid var(--line); padding: 8px 12px 8px 10px; font-size: 11px; font-weight: 700; transition: transform .15s var(--ease-standard), border-color .15s; }
    .cloud-pill:active { transform: scale(.94); }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 12px rgba(52,224,161,.6); }
    .pulse-dot { animation: pulse-dot 2.2s ease-in-out infinite; }
    @keyframes pulse-dot { 0%,100% { box-shadow: 0 0 0 0 rgba(52,224,161,.35); } 50% { box-shadow: 0 0 0 7px rgba(52,224,161,0); } }

    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); }
    .card + .card, .card + .outline, .outline + .card { margin-top: 12px; }
    /* Dark-heavy, accent-cyan: the hero card used to be a big bright cyan fill (the "too much
       cyan" complaint) — inverted so the card itself stays dark like everything else, and cyan is
       used only where it should be: the eyebrow, the ring, and the one CTA button. */
    .focus-card { padding: 20px; background: linear-gradient(150deg, var(--surface-3) 0%, var(--surface) 75%); background-size: 200% 200%; animation: gradient-pan 14s ease-in-out infinite alternate; color: var(--text); border: 1px solid var(--ember-soft); display: flex; gap: 14px; align-items: center; box-shadow: var(--shadow-md); position: relative; overflow: hidden; }
    @keyframes gradient-pan { from { background-position: 0% 40%; } to { background-position: 100% 60%; } }
    .focus-card::after { content: ""; position: absolute; inset: 0; background: radial-gradient(160px 160px at 88% -10%, var(--ember-soft), transparent 70%); pointer-events: none; }
    .focus-card .focus-copy { flex: 1; position: relative; z-index: 1; }
    .focus-card .eyebrow { color: var(--ember); }
    .focus-card h2 { margin: 7px 0 5px; font-size: 26px; color: var(--text); }
    .focus-meta { color: var(--text-dim); font-size: 13px; font-weight: 600; }
    .primary { border: 0; background: var(--ember); color: var(--ember-ink); border-radius: 13px; padding: 12px 16px; font-size: 13px; font-weight: 800; margin-top: 16px; display: inline-flex; align-items: center; gap: 7px; transition: transform .15s var(--ease-standard), filter .15s; box-shadow: 0 8px 22px -10px rgba(79,209,197,.5); }
    .primary:active { transform: scale(.96); filter: brightness(.92); }
    .week-ring { width: 88px; height: 88px; display: grid; place-items: center; position: relative; flex: 0 0 auto; z-index: 1; }
    .week-ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
    .week-ring svg circle { fill: none; stroke-width: 8; }
    .week-ring svg .track { stroke: var(--surface-3); }
    .week-ring svg .fill { stroke: var(--ember); stroke-linecap: round; transition: stroke-dashoffset 1s var(--ease-out); }
    .week-ring > span { position: relative; z-index: 1; text-align: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 24px; line-height: .9; }
    .week-ring small { display: block; font-size: 10px; font-weight: 700; opacity: .68; margin-top: 4px; font-family: 'Inter', sans-serif; }
    .section-head { display: flex; align-items: center; gap: 10px; margin: 24px 0 12px; position: relative; z-index: 1; }
    .section-head h3 { flex: 1; }
    .link { color: var(--ember); font-size: 12px; font-weight: 800; background: none; border: 0; padding: 0; display: inline-flex; align-items: center; gap: 4px; transition: opacity .15s; }
    .link:active { opacity: .6; }
    .quick-grid, .stat-grid { display: grid; gap: 10px; position: relative; z-index: 1; }
    .quick-grid { grid-template-columns: 1fr 1fr; }
    .quick-card { padding: 15px; min-height: 128px; text-align: left; color: var(--text); display: flex; flex-direction: column; }
    .quick-card:hover, .routine-card:hover, .history-row:hover, .spotlight-card:hover { border-color: var(--muted-2); transform: translateY(-1px); }
    .quick-card:active, .routine-card:active { transform: scale(.98); }
    .quick-card, .routine-card, .history-row, .spotlight-card { transition: border-color .18s var(--ease-standard), transform .18s var(--ease-standard), box-shadow .18s; }
    .icon-box { width: 34px; height: 34px; display: grid; place-items: center; background: var(--ember-soft); color: var(--ember); border-radius: 12px; }
    .icon-box.mint { background: var(--mint-soft); color: var(--mint); }
    .icon-box.sky { background: var(--sky-soft); color: var(--sky); }
    .quick-card strong { display: block; margin-top: 14px; font-size: 14px; font-weight: 700; }
    .quick-card span { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .stat-grid { grid-template-columns: repeat(3, 1fr); }
    .stat { padding: 14px 12px; min-width: 0; }
    .stat-label { display: block; color: var(--muted); font-size: 9px; font-weight: 800; letter-spacing: .08em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; }
    .stat-value { display: block; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stat-caption { color: var(--muted); font-size: 10px; }
    .history-row { padding: 10px 4px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid var(--line-soft); border-radius: var(--r-sm); }
    .history-delete { flex: none; border: 0; background: transparent; color: var(--muted); width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; transition: color .15s, background .15s, transform .15s var(--ease-standard); }
    .history-delete:hover { color: var(--danger); background: rgba(255,107,107,.12); }
    .history-delete:active { transform: scale(.88); }
    .history-row:last-child { border-bottom: 0; }
    .history-icon { width: 42px; height: 42px; border-radius: 13px; background: var(--surface-2); display: grid; place-items: center; color: var(--ember); flex: none; }
    .history-copy { flex: 1; min-width: 0; }
    .history-copy strong, .history-copy span { display: block; }
    .history-copy strong { font-size: 14px; font-weight: 700; }
    .history-copy span, .history-metric span { color: var(--muted); font-size: 11px; margin-top: 2px; }
    .history-metric { text-align: right; }
    .history-metric strong, .history-metric span { display: block; }
    .history-metric strong { font-size: 13px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; }
    .history-metric .pr { color: var(--mint); font-family: 'Inter', sans-serif; font-weight: 800; font-size: 10px; }

    .bottom-nav { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); width: min(calc(100% - 28px), 400px); height: 68px; padding: 6px; display: grid; grid-template-columns: repeat(4, 1fr); background: rgba(20,23,28,.78); backdrop-filter: blur(20px) saturate(160%); border: 1px solid rgba(255,255,255,.06); border-radius: 22px; z-index: 10; box-shadow: var(--shadow-lg); }
    .nav-indicator { position: absolute; top: 6px; bottom: 6px; left: 6px; width: calc(25% - 3px); background: var(--surface-3); border-radius: 16px; transition: transform .45s var(--ease-spring); z-index: 0; }
    .nav-item { position: relative; z-index: 1; border: 0; color: var(--muted); background: transparent; border-radius: 14px; display: grid; place-items: center; gap: 3px; font-size: 10px; font-weight: 700; transition: color .2s, transform .15s var(--ease-standard); }
    .nav-item:active { transform: scale(.9); }
    .nav-item .ic { transition: transform .3s var(--ease-spring); }
    .nav-item.active { color: var(--ember); }
    .nav-item.active .ic { transform: translateY(-1px) scale(1.05); }
    .routine-header { display: flex; align-items: end; gap: 12px; margin-bottom: 18px; }
    .routine-header > div { flex: 1; }
    .program-card { padding: 18px; }
    .program-top { display: flex; align-items: center; gap: 12px; }
    .program-logo { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: linear-gradient(135deg, var(--violet), #7c5cf0); color: #1b1030; font-weight: 800; font-size: 10px; flex: none; }
    .program-copy { flex: 1; min-width: 0; }
    .program-copy strong, .program-copy span { display: block; }
    .program-copy strong { font-size: 14px; font-weight: 700; }
    .program-copy span { color: var(--muted); font-size: 11px; margin-top: 3px; }
    .chevron { color: var(--muted); flex: none; }
    .progress-line { height: 6px; border-radius: 99px; background: var(--surface-2); margin-top: 15px; overflow: hidden; }
    .progress-line i { display: block; width: 0; height: 100%; border-radius: inherit; background: var(--violet); transition: width 1s var(--ease-out); }
    .routine-card { padding: 14px; display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .routine-accent { width: 7px; height: 50px; border-radius: 8px; flex: 0 0 auto; }
    .routine-copy { flex: 1; min-width: 0; }
    .routine-copy strong, .routine-copy span { display: block; }
    .routine-copy strong { font-size: 15px; font-weight: 700; }
    .routine-copy span { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .start-small { width: 38px; height: 38px; border: 0; border-radius: 50%; display: grid; place-items: center; background: var(--ember); color: #fff; flex: none; transition: transform .15s var(--ease-standard); }
    .start-small:active { transform: scale(.88); }
    .outline { width: 100%; background: transparent; border: 1px dashed var(--line); color: var(--text-dim); border-radius: var(--r-md); padding: 13px; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 7px; transition: border-color .15s, background .15s, transform .15s var(--ease-standard); }
    .outline:hover { border-color: var(--muted-2); background: var(--surface-2); }
    .outline:active { transform: scale(.98); }
    .chart-card { padding: 18px; }
    .chart-head { display: flex; align-items: start; }
    .chart-head > div { flex: 1; }
    .chart-value { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 27px; margin-top: 10px; }
    .positive { color: var(--mint); font-size: 12px; font-weight: 700; margin-top: 4px; display: flex; align-items: center; gap: 4px; }
    .bars { height: 118px; display: flex; align-items: end; gap: 6px; margin-top: 18px; border-bottom: 1px solid var(--line); }
    .bar { flex: 1; background: var(--surface-3); border-radius: 8px 8px 2px 2px; min-height: 22px; transform-origin: bottom; }
    .bar:last-child { background: linear-gradient(180deg, var(--ember-2), var(--ember)); }
    .chart-labels { display: flex; justify-content: space-between; color: var(--muted); font-size: 9px; margin-top: 8px; text-transform: uppercase; letter-spacing: .05em; }
    .muscle-card { padding: 18px; }
    .muscle-row { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 12px; }
    .muscle-row label { width: 74px; font-weight: 600; color: var(--text-dim); }
    .muscle-row .progress-line { flex: 1; margin: 0; height: 8px; }
    .muscle-row .progress-line i { transition: width 1.1s var(--ease-out); }
    .muscle-row b { width: 20px; text-align: right; font-weight: 800; }
    .review-card { padding: 16px; display: flex; gap: 12px; align-items: flex-start; }
    .review-card .link { flex: none; margin-top: 2px; }
    .review-icon { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 14px; background: var(--ember-soft); color: var(--ember); flex: none; }
    .review-copy { flex: 1; }
    .review-copy strong, .review-copy span { display: block; }
    .review-copy strong { font-weight: 700; }
    .review-copy span { color: var(--muted); font-size: 11px; margin-top: 4px; }

    .workout-screen { min-height: 100vh; background: var(--bg); }
    .workout-top { display: flex; gap: 10px; align-items: center; padding: 12px 12px; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 3; background: rgba(12,14,17,.86); backdrop-filter: blur(18px); }
    .back-btn, .more-btn { border: 0; background: transparent; color: var(--muted); width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; transition: background .15s, color .15s, transform .15s var(--ease-standard); }
    .back-btn:hover, .more-btn:hover { background: var(--surface-2); color: var(--text); }
    .back-btn:active, .more-btn:active { transform: scale(.9); }
    .workout-title { flex: 1; min-width: 0; }
    .workout-title strong, .workout-title span { display: block; }
    .workout-title strong { font-size: 15px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .workout-title span { color: var(--ember); font-size: 10px; font-weight: 800; margin-top: 3px; letter-spacing: .04em; }
    .finish-btn { border: 0; background: var(--mint-soft); color: var(--mint); font-size: 12px; font-weight: 800; padding: 9px 14px; border-radius: 999px; transition: transform .15s var(--ease-standard); }
    .finish-btn:active { transform: scale(.94); }
    .workout-scroll { padding: 16px 14px 28px; max-height: calc(100vh - 62px); overflow-y: auto; }
    .workout-intro { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .workout-intro > div { flex: 1; }
    .workout-intro p { font-size: 15px; font-weight: 700; margin-top: 4px; }
    .tag { padding: 6px 9px; background: var(--surface-2); color: var(--muted); font-size: 9px; font-weight: 800; letter-spacing: .04em; }
    .rest-timer { display: flex; align-items: center; gap: 12px; border: 1px solid rgba(255,90,54,.28); background: linear-gradient(120deg, rgba(255,90,54,.12), rgba(255,90,54,.02)); border-radius: 18px; padding: 11px 14px; margin: 0 0 14px; }
    .timer-ring { position: relative; width: 44px; height: 44px; flex: none; }
    .timer-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .timer-ring circle { fill: none; stroke-width: 4; }
    .timer-ring .track { stroke: rgba(255,90,54,.18); }
    .timer-ring .fill { stroke: var(--ember); stroke-linecap: round; transition: stroke-dashoffset .9s linear; }
    .timer-ring .ic { position: absolute; inset: 0; margin: auto; color: var(--ember); }
    .timer-copy { flex: 1; }
    .timer-copy span, .timer-copy strong { display: block; }
    .timer-copy span { color: var(--ember); font-size: 10px; font-weight: 800; letter-spacing: .08em; }
    .timer-copy strong { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px; margin-top: 1px; }
    .timer-action { border: 0; background: var(--surface-2); color: var(--text-dim); width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; transition: transform .15s var(--ease-standard); }
    .timer-action:active { transform: scale(.88); }
    .skip { border: 0; background: transparent; color: var(--ember); font-size: 12px; font-weight: 800; }

      if (id === 'bench') return { exercise, latest: '85 kg × 6', best: '85 kg', change: '+6.2%', strength: [58, 60, 61, 64, 64, 68, 71, 70, 74, 78, 80, 84], volume: [38, 43, 49, 46, 55, 58, 61, 68, 65, 74, 78, 88], intensity: [63, 67, 66, 71, 69, 74, 76, 73, 78, 81, 82, 86], insight: 'You added 5 kg to your top set while keeping reps in the same range.' };
      const seed = exercise.name.length + exercise.id.length;
      const base = 46 + (seed % 13);
      const strength = Array.from({ length: 12 }, (_, i) => Math.min(96, base + i * 2 + ((i + seed) % 4)));
      const volume = strength.map((value, i) => Math.min(96, value - 8 + ((i * 3 + seed) % 10)));
      const intensity = strength.map((value, i) => Math.min(96, value + ((i + 1) % 5) - 2));
      const latest = exercise.tracking === 'reps' ? '24 reps' : exercise.tracking === 'time' ? '01:45' : exercise.tracking.includes('distance') ? '5.2 km' : '42.5 kg × 8';
      return { exercise, latest, best: exercise.tracking === 'reps' ? '24 reps' : exercise.tracking === 'time' ? '01:45' : exercise.tracking.includes('distance') ? '5.2 km' : '42.5 kg', change: `+${(4 + seed % 8).toFixed(1)}%`, strength, volume, intensity, insight: `${exercise.name} is trending up across the sample timeline. Keep one clean rep in reserve before adding load.` };
    }
    function graphPoints(values) {
      const min = Math.min(...values); const max = Math.max(...values); const span = max - min || 1;
      return values.map((value, index) => `${(24 + (312 * index / (values.length - 1))).toFixed(1)},${(28 + ((max - value) / span * 112)).toFixed(1)}`).join(' ');
    }
    function graphArea(points) { return `24,150 ${points} 336,150`; }
    function sparklinePoints(values) {
      const min = Math.min(...values); const max = Math.max(...values); const span = max - min || 1;
      return values.map((value, index) => `${(12 + (336 * index / (values.length - 1))).toFixed(1)},${(10 + ((max - value) / span * 42)).toFixed(1)}`).join(' ');
    }
    function statValue(raw) {
      const str = String(raw);
      const match = str.match(/^([+-]?)([\d,]+(?:\.\d+)?)(.*)$/);
      if (!match) return `<span>${str}</span>`;
      const [, sign, numPart, suffix] = match;
      const target = parseFloat(numPart.replace(/,/g, ''));
      const decimals = (numPart.split('.')[1] || '').length;
      if (!isFinite(target)) return `<span>${str}</span>`;
      return `<span class="countup" data-target="${target}" data-decimals="${decimals}" data-sign="${sign}" data-suffix="${suffix}">${sign}0${suffix}</span>`;
    }
    function onboardingDots(step) { return `<div class="onboarding-dots" aria-label="Onboarding step ${step + 1} of ${tourFeatures.length + 1}">${Array.from({ length: tourFeatures.length + 1 }, (_, index) => `<i class="${index === step ? 'active' : ''}"></i>`).join('')}</div>`; }
    function meshBg() { return `<div class="mesh"><i></i><i></i><i></i></div>`; }
    function onboardingView() {
      if (state.onboardingStep > 0) {
        const feature = tourFeatures[state.onboardingStep - 1];
        const finalStep = state.onboardingStep === tourFeatures.length;
        return `<section class="onboarding onboarding-feature">${meshBg()}<div class="onboarding-tour-head"><div class="onboarding-mark small"><img src="assets/logo.svg" alt="LiftLog"></div><div class="eyebrow">LIFTLOG · QUICK TOUR · STEP ${state.onboardingStep}/${tourFeatures.length}</div></div><div class="onboarding-tour-body">${onboardingDots(state.onboardingStep)}<div class="feature-card reveal"><div class="feature-top"><span class="feature-number">${feature.number}</span><span class="feature-glyph">${ic(feature.glyph, 'ic-lg')}</span></div><div><h2>${feature.title}</h2><p>${feature.copy}</p></div></div></div><div class="onboarding-panel"><p class="name-hint" style="margin:0">Built for your next session, ${displayName()}.</p><button class="primary" data-action="${finalStep ? 'finish-tour' : 'next-onboarding'}">${finalStep ? 'Start exploring' : 'Next'} ${ic('arrow-right', 'ic-sm')}</button><button class="skip-onboarding" data-action="skip-onboarding">Skip tour</button></div></section>`;
      }
      return `<section class="onboarding">${meshBg()}<div><div class="onboarding-mark"><img src="assets/logo.svg" alt="LiftLog"></div><div class="eyebrow" style="margin-top:28px">LIFTLOG · PERSONAL LOGBOOK</div>${onboardingDots(0)}<h1>Train with a little more <em>signal.</em></h1><p class="onboarding-copy">A calm, fast place to log the work, compare the last session, and see the trend you are building.</p></div><div class="onboarding-panel"><label class="field-label" for="name-input">What should we call you?</label><input id="name-input" autocomplete="off" placeholder="Your first name" value="${state.userName}"><p class="name-hint">This stays on your device in the preview. It will become your profile when accounts are added.</p><button class="primary" data-action="finish-onboarding">Continue ${ic('arrow-right', 'ic-sm')}</button><button class="skip-onboarding" data-action="skip-onboarding">Use Athlete for now</button></div></section>`;

    function todayView() {
      const isReal = state.mode === 'real' && !!state.session;
      const realRows = state.realWorkouts || [];
      const realStats = isReal ? computeRealStats(realRows) : null;
      const weeklyGoal = 4;
      const ringDone = isReal ? Math.min(weeklyGoal, realStats.workoutsThisWeek) : 3;
      const ringCirc = 238.8;
      const ringOffset = (ringCirc * (1 - ringDone / weeklyGoal)).toFixed(1);
      const statsMarkup = isReal
        ? stat('WORKOUTS', String(realStats.workoutsThisWeek), 'last 7 days')
          + stat('VOLUME', `${Math.round(realStats.volumeThisWeek).toLocaleString()} kg`, 'last 7 days')

        : stat('WORKOUTS', '28', '12 week sample') + stat('VOLUME', '84,320 kg', 'all lifts') + stat('STREAK', '12d', 'best this cycle');
      const sessionsMarkup = isReal
        ? (state.realLoading
          ? `<p class="subtle" style="padding:16px 0">Loading your sessions…</p>`
          : realRows.length
            ? realRows.slice(0, 4).map(row => history(realRowToHistoryItem(row), 'delete-real-workout')).join('')

        : (state.history.length
          ? state.history.slice(0, 4).map(item => history(item, 'delete-demo-workout')).join('')
          : emptyState('dumbbell', 'No sessions yet', 'Finish a workout and it will show up here.'));
      return `<section class="screen"><div class="glow"></div><div class="scroll">
        <div class="topline"><div class="topline-copy"><div class="eyebrow">${ic('calendar-blank', 'ic-sm')} ${new Intl.DateTimeFormat(undefined, { weekday: 'long', month: 'short', day: 'numeric' }).format(new Date()).toUpperCase()}${state.weatherEnabled && state.weather ? ` · ${state.weather.tempC}°C` : ''}</div><h1>Good morning, ${displayName()},<br>ready to lift?</h1></div>${cloudPill()}</div>
        ${card(`<div class="focus-copy"><div class="eyebrow">TODAY'S FOCUS</div><h2>Upper strength</h2><div class="focus-meta">7 exercises · about 52 min</div><button class="primary" data-action="start-routine" data-routine="upper">${ic('play', 'ic-sm')} Start Upper A</button></div><div class="week-ring"><svg viewBox="0 0 88 88"><circle class="track" cx="44" cy="44" r="38"></circle><circle class="fill" cx="44" cy="44" r="38" stroke-dasharray="${ringCirc}" stroke-dashoffset="${ringOffset}"></circle></svg><span>${ringDone}<small>of ${weeklyGoal}</small></span></div>`, 'focus-card')}
        ${modeCard()}
        ${section('Quick start', 'View all', 'data-tab="routines"')}
        <div class="quick-grid"><div class="card quick-card" data-action="start-empty"><div class="icon-box">${ic('plus')}</div><strong>Empty workout</strong><span>Build as you go</span></div><div class="card quick-card" data-action="start-routine" data-routine="full"><div class="icon-box mint">${ic('repeat')}</div><strong>Recent routine</strong><span>Full Body · 5 ex</span></div></div>
        ${section('This week', 'See analytics', 'data-tab="progress"')}
        <div class="stat-grid">${statsMarkup}</div>
        ${section('Recent sessions', 'History', 'data-action="open-history"')}
        ${sessionsMarkup}
      </div>${nav()}</section>`;
    }
    function stat(label, value, caption) { return `<div class="card stat"><span class="stat-label">${label}</span><strong class="stat-value">${statValue(value)}</strong><span class="stat-caption">${caption}</span></div>`; }
    // item: {id, name, meta, metric, pr}. deleteAction, when passed, renders a trash button
    // wired to that data-action with data-workout-id="item.id" — lets you delete a workout you
    // logged just to try the app out (both local demo entries and real Supabase rows).
    function history(item, deleteAction) {
      return `<div class="history-row"><div class="history-icon">${ic('barbell', 'ic-sm')}</div><div class="history-copy"><strong>${item.name}</strong><span>${item.meta}</span></div><div class="history-metric"><strong>${item.metric}</strong><span class="pr">${item.pr || ''}</span></div>${deleteAction ? `<button class="history-delete" data-action="${deleteAction}" data-workout-id="${item.id}" aria-label="Delete ${item.name}">${ic('trash', 'ic-sm')}</button>` : ''}</div>`;
    }
    function realRowToHistoryItem(row) {
      return { id: row.id, name: row.name, meta: `${formatRelativeDate(row.started_at)} · ${formatMinutes(row.duration_seconds)}`, metric: `${Math.round(row.total_volume || 0).toLocaleString()} kg`, pr: '' };
    }
    function historyView() {
      // Bug fixed here: this screen used to always read the local demo array, even in Real mode —
      // so real Supabase workouts (including ones logging brand-new custom exercises) never showed
      // up here. It now mirrors exactly what Today/Progress already switch on.
      const isReal = state.mode === 'real' && !!state.session;

          ${state.realLoading ? `<p class="subtle" style="padding:16px 0">Loading your sessions…</p>` : rows.length ? card(rows.map(row => history(realRowToHistoryItem(row), 'delete-real-workout')).join('')) : emptyState('dumbbell', 'No sessions yet', 'Finish a workout and it will show up here, synced to your account.')}
        </div></section>`;

    function settingsView() {

        ${section('Account')}

    function progressView() {
      if (state.mode === 'real' && state.session) return realProgressView();
      const range = progressData();
      const rangeOptions = ['4 weeks', '12 weeks', '1 year', 'All time'];
      const maxMuscle = Math.max(...range.muscles.map(([, sets]) => sets));
      const spotlight = exerciseProfile('bench');
      const points = sparklinePoints(spotlight.strength);

      return `<section class="screen"><div class="glow"></div><div class="scroll"><div class="topline"><div class="topline-copy"><h1>Progress</h1><p class="subtle" style="margin-top:7px">Your training, in context.</p></div></div>
        <div class="progress-toolbar"><span class="eyebrow">TIME WINDOW</span><div class="range-switcher" role="group" aria-label="Progress time window">${rangeOptions.map(option => `<button class="range-option ${state.progressRange === option ? 'active' : ''}" data-action="progress-range" data-range="${option}">${option.toUpperCase()}</button>`).join('')}</div></div>
        <div class="stat-grid progress-summary">${stat('PRS IN RANGE', range.prs, range.start)}${stat('TRAINING DAYS', range.days, range.start)}</div>
        ${card(`<div class="chart-head"><div><h3>Volume trend</h3><div class="chart-value">${statValue(range.volume)} <small>kg</small></div><div class="positive">${ic('trend-up', 'ic-sm')} ${range.delta} vs. previous period</div></div><span class="tag">${range.start.toUpperCase()}</span></div><div class="bars">${range.bars.map((height, index) => `<i class="bar" style="height:${height}%" data-action="bar-detail" data-index="${index}" role="button" aria-label="${barLabel(state.progressRange, index)} detail"></i>`).join('')}</div><div class="chart-labels"><span>${range.start}</span><span>Today</span></div><p class="chart-note">Tap a bar to see what that stretch looked like in brief.</p>`, 'chart-card')}
        ${card(`<div class="chart-head"><h3 style="flex:1">Working sets by muscle</h3><span class="subtle" style="font-size:11px">${state.progressRange === 'All time' ? 'lifetime' : 'in range'}</span></div>${range.muscles.map(([name, sets, color]) => `<div class="muscle-row"><label>${name}</label><div class="progress-line"><i style="width:${Math.max(10, Math.round(sets / maxMuscle * 100))}%;background:${color}"></i></div><b>${sets}</b></div>`).join('')}`, 'muscle-card')}
        ${section('Progress by exercise', 'Browse all', 'data-action="library"')}

    function enhanceMotion() {
      const reduced = prefersReducedMotion();
      const nodes = document.querySelectorAll('.reveal');
      const motion = window.animejs || window.anime;
      if (!reduced) {
        nodes.forEach((node, index) => {
          if (motion?.animate) {
            motion.animate(node, { opacity: [0, 1], y: [14, 0], scale: [.985, 1], delay: index * 35, duration: 520, ease: 'outCubic' });
          } else {
            node.animate([{ opacity: 0, transform: 'translateY(14px) scale(.985)' }, { opacity: 1, transform: 'translateY(0) scale(1)' }], { duration: 520, delay: index * 35, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'both' });
          }
        });
        document.querySelectorAll('.bar').forEach((bar, index) => {
          if (motion?.animate) motion.animate(bar, { scaleY: [0, 1], transformOrigin: 'bottom', delay: 180 + index * 28, duration: 700, ease: 'outExpo' });
        });
        document.querySelectorAll('.sparkline polyline, .exercise-graph .trend').forEach(line => {
          const length = line.getTotalLength ? line.getTotalLength() : 400;
          line.style.strokeDasharray = length;
          line.style.strokeDashoffset = length;
          line.animate([{ strokeDashoffset: length }, { strokeDashoffset: 0 }], { duration: 900, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'forwards' });
        });
      }
      document.querySelectorAll('.countup').forEach(el => {
        const target = parseFloat(el.dataset.target);
        const decimals = Number(el.dataset.decimals || 0);
        const sign = el.dataset.sign || '';
        const suffix = el.dataset.suffix || '';
        const fmt = (n) => sign + n.toLocaleString(undefined, { minimumFractionDigits: decimals, maximumFractionDigits: decimals }) + suffix;
        if (reduced || !isFinite(target)) { el.textContent = fmt(target); return; }
        const start = performance.now();
        const duration = 900;
        function tick(now) {
          const p = Math.min(1, (now - start) / duration);
          const eased = 1 - Math.pow(1 - p, 3);
          el.textContent = fmt(target * eased);
          if (p < 1) requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      });
    }
    let currentTransition = null;
    function render() {
      const doRender = () => {
        const root = document.querySelector('#app');
        const view = state.onboarding ? onboardingView() : state.screen === 'library' ? libraryView() : state.screen === 'history' ? historyView() : state.screen === 'exercise-detail' ? exerciseDetailView() : state.workout ? workoutView() : state.tab === 'today' ? todayView() : state.tab === 'routines' ? routinesView() : state.tab === 'settings' ? settingsView() : progressView();
        root.innerHTML = view + (state.showAuthModal ? authModalView() : '') + (state.showCustomExerciseModal ? customExerciseModalView() : '');
        requestAnimationFrame(enhanceMotion);
      };
      if (document.startViewTransition && !prefersReducedMotion()) {
        if (currentTransition) { try { currentTransition.skipTransition(); } catch (e) {} }
        const transition = document.startViewTransition(doRender);
        currentTransition = transition;
        transition.ready.catch(() => {});
        transition.finished.catch(() => {}).finally(() => { if (currentTransition === transition) currentTransition = null; });
      } else {
        doRender();
      }
    }
    function showToast(message) { const node = document.querySelector('#toast'); node.innerHTML = `${ic('check-circle', 'ic-sm')}<span>${message}</span>`; node.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => node.classList.remove('show'), 2600); }
    function selectedSet(exerciseIndex, setIndex) { return state.workout.exercises[exerciseIndex].sets[setIndex]; }
    function cycleRpe(set) { set.rpe = set.rpe ? (set.rpe >= 10 ? '' : Number(set.rpe) + 1) : 6; }
    function cycleType(set) { const types = ['Regular', 'Warm-up', 'Drop', 'Failure']; set.type = types[(types.indexOf(set.type) + 1) % types.length]; }

    document.addEventListener('click', event => {
      if (event.target.dataset?.action === 'close-picker-backdrop') { state.showPicker = false; render(); return; }
      const target = event.target.closest('[data-action], [data-tab]'); if (!target) return;
      if (target.dataset.tab) { state.screen = 'app'; state.tab = target.dataset.tab; render(); return; }
      const action = target.dataset.action;
      // Absorbs clicks on inert space inside a modal card (e.g. its padding or plain text) so
      // they don't fall through to the backdrop's close action underneath.
      if (action === 'noop') return;
      if (action === 'finish-onboarding') { const input = document.querySelector('#name-input'); state.userName = input?.value.trim() || 'Athlete'; localStorage.setItem('liftlog_name', state.userName); state.onboardingStep = 1; render(); return; }
      if (action === 'next-onboarding') { state.onboardingStep = Math.min(tourFeatures.length, state.onboardingStep + 1); render(); return; }
      if (action === 'finish-tour') { state.onboarding = false; localStorage.setItem('liftlog_name', state.userName || 'Athlete'); localStorage.setItem('liftlog_onboarded', '1'); render(); showToast(`Welcome, ${displayName()}`); return; }
      if (action === 'skip-onboarding') { state.userName = 'Athlete'; state.onboarding = false; localStorage.setItem('liftlog_name', state.userName); localStorage.setItem('liftlog_onboarded', '1'); render(); return; }
      if (action === 'toggle-mode') {
        if (state.mode === 'demo') {
          if (state.session) {
            state.mode = 'real';
            localStorage.setItem('liftlog_mode', 'real');
            render();
            showToast('Real mode on · syncing your data');
            fetchRealWorkouts().then(render);
          } else {
            state.showAuthModal = true; state.authModalMode = 'signin'; state.authError = ''; state.authInfo = '';
            render();
          }
        } else {
          state.mode = 'demo'; localStorage.setItem('liftlog_mode', 'demo'); render();
          showToast('Demo mode · sample data on');
        }
        return;
      }
      if (action === 'open-auth-modal') { state.showAuthModal = true; state.authModalMode = 'signin'; state.authError = ''; state.authInfo = ''; render(); return; }
      if (action === 'close-auth-modal') { state.showAuthModal = false; render(); return; }
      if (action === 'open-custom-exercise-modal') { state.showCustomExerciseModal = true; state.customExerciseError = ''; render(); return; }
      if (action === 'close-custom-exercise-modal') { state.showCustomExerciseModal = false; render(); return; }
      if (action === 'submit-custom-exercise') {
        const name = document.querySelector('#custom-ex-name')?.value.trim() || '';
        const category = document.querySelector('#custom-ex-category')?.value || EXERCISE_CATEGORIES[0];
        const equipment = document.querySelector('#custom-ex-equipment')?.value.trim() || 'Other';
        const muscle = document.querySelector('#custom-ex-muscle')?.value.trim() || category;
        const tracking = document.querySelector('#custom-ex-tracking')?.value || TRACKING_TYPES[0];
        if (!name) { state.customExerciseError = 'Give it a name'; render(); return; }
        const newExercise = { id: `custom-${Date.now()}`, name, category, equipment, muscle, tracking, custom: true };
        state.customExercises.push(newExercise);
        localStorage.setItem('liftlog_custom_exercises', JSON.stringify(state.customExercises));
        state.showCustomExerciseModal = false;
        state.customExerciseError = '';
        render();
        showToast(`${name} added to your library`);
        return;
      }
      if (action === 'delete-custom-exercise') {
        const id = target.dataset.exerciseId;
        const exercise = state.customExercises.find(ex => ex.id === id);
        if (exercise && confirm(`Remove "${exercise.name}" from your custom exercises?`)) {
          state.customExercises = state.customExercises.filter(ex => ex.id !== id);
          localStorage.setItem('liftlog_custom_exercises', JSON.stringify(state.customExercises));
          const list = document.querySelector('.library-list');
          if (list) list.innerHTML = libraryItems(); else render();
          showToast('Custom exercise removed');
        }
        return;
      }
      if (action === 'toggle-auth-mode') { state.authModalMode = state.authModalMode === 'signup' ? 'signin' : 'signup'; state.authError = ''; state.authInfo = ''; render(); return; }
      if (action === 'submit-auth') {
        const email = (document.querySelector('#auth-email')?.value || '').trim();
        const password = document.querySelector('#auth-password')?.value || '';
        state.authEmail = email; state.authPassword = password;
        if (!email || !password) { state.authError = 'Enter an email and password'; render(); return; }
        const isSignUp = state.authModalMode === 'signup';
        state.authLoading = true; state.authError = ''; state.authInfo = ''; render();
        (isSignUp ? signUp(email, password) : signIn(email, password)).then(() => {
          state.authLoading = false; state.showAuthModal = false; state.authPassword = '';
          state.mode = 'real'; localStorage.setItem('liftlog_mode', 'real');
          render();
          showToast(`Welcome${state.session?.email ? ', ' + state.session.email : ''}`);
          fetchRealWorkouts().then(render);
        }).catch(error => {
          state.authLoading = false;
          if (isSignUp && /confirm/i.test(error.message)) state.authInfo = error.message;
          else state.authError = error.message;
          render();
        });
        return;
      }
      if (action === 'sign-out') { signOut(); state.mode = 'demo'; localStorage.setItem('liftlog_mode', 'demo'); render(); showToast('Signed out'); return; }
      if (action === 'library') { state.screen = 'library'; render(); return; }
      if (action === 'close-library') { state.screen = 'app'; render(); return; }
      if (action === 'open-history') { state.screen = 'history'; render(); return; }
      if (action === 'close-history') { state.screen = 'app'; render(); return; }
      if (action === 'bar-detail') {
        const idx = Number(target.dataset.index);
        const range = progressData();
        const heights = range.bars;
        const totalHeight = heights.reduce((sum, h) => sum + h, 0);
        const totalVolume = parseFloat(String(range.volume).replace(/,/g, ''));
        const totalSets = parseFloat(String(range.sets));
        const volume = Math.round(totalVolume * heights[idx] / totalHeight);
        const sets = Math.round(totalSets * heights[idx] / totalHeight);
        showToast(`${barLabel(state.progressRange, idx)} · ${volume.toLocaleString()} kg · ${sets} sets`);
        return;
      }
      if (action === 'toggle-setting') {
        const setting = target.dataset.setting;
        if (setting === 'adaptive-theme') { state.adaptiveTheme = !state.adaptiveTheme; localStorage.setItem('liftlog_adaptive_theme', state.adaptiveTheme ? '1' : '0'); applySkyMood(); }
        if (setting === 'weather-theme') {
          state.weatherEnabled = !state.weatherEnabled;
          localStorage.setItem('liftlog_weather_enabled', state.weatherEnabled ? '1' : '0');
          if (state.weatherEnabled) refreshWeather(); else { state.weather = null; localStorage.removeItem('liftlog_weather'); applyWeatherMood(); }
        }
        render();
        return;
      }
      if (action === 'reset-history') { state.history = []; localStorage.setItem('liftlog_history', JSON.stringify(state.history)); render(); showToast('Demo history cleared'); return; }
      if (action === 'delete-demo-workout') {
        const id = target.dataset.workoutId;
        const item = state.history.find(h => h.id === id);
        if (item && confirm(`Delete "${item.name}"? This can't be undone.`)) {
          state.history = state.history.filter(h => h.id !== id);
          localStorage.setItem('liftlog_history', JSON.stringify(state.history));
          render();
          showToast('Workout deleted');
        }
        return;
      }
      if (action === 'delete-real-workout') {
        const id = target.dataset.workoutId;
        if (!confirm('Delete this workout from Supabase? This can\'t be undone.')) return;
        supabaseRestRequest('DELETE', `workouts?id=eq.${id}`).then(() => {
          showToast('Workout deleted');
          return fetchRealWorkouts();
        }).then(render).catch(error => showToast(`Could not delete · ${error.message}`));
        return;
      }
      if (action === 'export-data') {
        try {
          exportData();
          showToast('Export downloaded');
        } catch (error) {
          showToast(`Export failed · ${error.message}`);
        }
        return;
      }
      if (action === 'replay-onboarding') { state.onboarding = true; state.onboardingStep = 0; localStorage.removeItem('liftlog_onboarded'); render(); return; }
      if (action === 'progress-range') { state.progressRange = target.dataset.range; localStorage.setItem('liftlog_progress_range', state.progressRange); render(); return; }
      if (action === 'radar-prev-week') { state.radarWeekIndex += 1; render(); return; }
      if (action === 'radar-next-week') { state.radarWeekIndex = Math.max(0, state.radarWeekIndex - 1); render(); return; }
      if (action === 'exercise-detail') { state.selectedExercise = target.dataset.exerciseId || 'bench'; state.screen = 'exercise-detail'; render(); return; }
      if (action === 'close-exercise-detail') { state.screen = 'app'; state.tab = 'progress'; render(); return; }
      if (action === 'exercise-metric') { state.exerciseMetric = target.dataset.metric; render(); return; }
      if (action === 'exercise-range') { state.exerciseRange = target.dataset.range; render(); return; }
      if (action === 'filter-category') { state.libraryCategory = target.dataset.category; render(); return; }
      if (action === 'add-sample') { state.history.unshift({ name: 'Demo check-in', meta: 'Just now · 42 min', metric: '9,240 kg', pr: '+1 PR' }); localStorage.setItem('liftlog_history', JSON.stringify(state.history)); render(); showToast('Sample session added to your timeline'); return; }
      if (action === 'start-routine') { const r = starterRoutines.find(x => x.id === target.dataset.routine); state.workout = starterWorkout(r?.name || 'Upper A'); state.rest = 0; state.showNotes = false; render(); }
      if (action === 'start-empty') { state.workout = emptyWorkout(); state.rest = 0; render(); }
      if (action === 'close-workout') { state.workout = null; render(); }
      if (action === 'finish-workout') {
        const workout = state.workout;
        const volume = workout.exercises.reduce((sum, ex) => sum + ex.sets.reduce((subtotal, set) => subtotal + (set.completed ? (Number(set.weight) || 0) * (Number(set.reps) || 0) : 0), 0), 0);
        const elapsedLabel = elapsed();
        state.workout = null; state.tab = 'today';
        if (state.mode === 'real' && state.session) {
          render();
          showToast('Saving to Supabase…');
          saveRealWorkout(workout, volume).then(() => {
            showToast('Workout saved to Supabase');
            return fetchRealWorkouts();
          }).then(render).catch(error => showToast(`Cloud save failed · ${error.message}`));
        } else {
          state.history.unshift({ name: workout.name, meta: `Just now · ${elapsedLabel}`, metric: `${Math.round(volume).toLocaleString()} kg`, pr: '' });
          localStorage.setItem('liftlog_history', JSON.stringify(state.history));
          render();
          showToast('Workout logged · sign in (Real mode) to sync it to Supabase');
        }
      }
      if (action === 'open-picker') { state.showPicker = true; state.pickerQuery = ''; render(); }
      if (action === 'close-picker') { state.showPicker = false; render(); }
      if (action === 'add-exercise') { const ex = allExercises().find(x => x.id === target.dataset.exerciseId); state.workout.exercises.push({ ...ex, previous: 'No history yet', note: '', superset: '', sets: [{ weight: '', reps: '', rpe: '', completed: false, type: 'Regular' }] }); state.showPicker = false; render(); }
      if (action === 'remove-exercise') { state.workout.exercises.splice(Number(target.dataset.index), 1); render(); }
      if (action === 'add-set') { state.workout.exercises[Number(target.dataset.index)].sets.push({ weight: '', reps: '', rpe: '', completed: false, type: 'Regular' }); render(); }
      if (action === 'complete-set') {
        const set = selectedSet(Number(target.dataset.exercise), Number(target.dataset.set));
        set.completed = !set.completed;
        if (set.completed) { state.rest = 90; state.restTotal = 90; }
        render();
        requestAnimationFrame(() => { const btn = document.querySelector(`[data-action="complete-set"][data-exercise="${target.dataset.exercise}"][data-set="${target.dataset.set}"]`); if (btn && !prefersReducedMotion()) { btn.classList.add('pop'); btn.addEventListener('animationend', () => btn.classList.remove('pop'), { once: true }); } });
      }
      if (action === 'cycle-rpe') { cycleRpe(selectedSet(Number(target.dataset.exercise), Number(target.dataset.set))); render(); }
      if (action === 'cycle-type') { cycleType(selectedSet(Number(target.dataset.exercise), Number(target.dataset.set))); render(); }
      if (action === 'rest-minus') { state.rest = Math.max(0, state.rest - 15); render(); }
      if (action === 'rest-plus') { state.rest += 15; state.restTotal = Math.max(state.restTotal, state.rest); render(); }
      if (action === 'rest-skip') { state.rest = 0; render(); }
      if (action === 'toggle-notes') { state.showNotes = !state.showNotes; render(); }
      if (action === 'toast') { showToast(target.dataset.message || 'Coming soon'); }
    });
    document.addEventListener('input', event => { const input = event.target; if (input.id === 'name-input') { state.userName = input.value; return; } if (input.id === 'settings-name') { state.userName = input.value; localStorage.setItem('liftlog_name', state.userName || 'Athlete'); return; } if (input.id === 'auth-email') { state.authEmail = input.value; return; } if (input.id === 'auth-password') { state.authPassword = input.value; return; } if (input.id === 'library-search') { state.libraryQuery = input.value; const list = document.querySelector('.library-list'); if (list) list.innerHTML = libraryItems(); return; } if (input.id === 'picker-search') { state.pickerQuery = input.value; const list = document.querySelector('#picker-options'); if (list) list.innerHTML = pickerOptions(); return; } if (input.id === 'workout-note') { state.workout.notes = input.value; return; } if (input.dataset.field) { const set = selectedSet(Number(input.dataset.exercise), Number(input.dataset.set)); set[input.dataset.field] = input.value; } });
    tickTimer = setInterval(() => {
      if (!state.workout) return;
      const elapsedNode = document.querySelector('.workout-title span');
      if (elapsedNode) elapsedNode.textContent = `${elapsed()} elapsed`;
      if (state.rest > 0) {
        state.rest -= 1;
        const restNode = document.querySelector('.timer-copy strong');
        const ringNode = document.querySelector('.timer-ring .fill');
        if (restNode) restNode.textContent = timer(state.rest);
        if (ringNode) { const circ = 2 * Math.PI * 18; const pct = state.restTotal > 0 ? Math.max(0, state.rest / state.restTotal) : 0; ringNode.setAttribute('stroke-dashoffset', (circ * (1 - pct)).toFixed(1)); }
        if (state.rest === 0) render();
      }
    }, 1000);
    const confirmedJustNow = handleAuthRedirect();
    render();
    applySkyMood();
    initGradientBackground();
    applyWeatherMood();
    if (state.weatherEnabled) refreshWeather();
    setInterval(applySkyMood, 5 * 60 * 1000);
    setInterval(() => { if (state.weatherEnabled) refreshWeather(); }, 20 * 60 * 1000);
    if (confirmedJustNow) { showToast(`Email confirmed — signed in as ${state.session.email}`); fetchRealWorkouts().then(render); }
    else if (state.mode === 'real' && state.session) fetchRealWorkouts().then(render);
  </script>
</body>
</html>
