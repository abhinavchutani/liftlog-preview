<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — LiftLog</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; --bg: #08090b; --ember: #ff5a36; --muted: #868d99; --text: #f5f6f8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; color: var(--text); display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; }
  .mark { width: 64px; height: 64px; border-radius: 20px; margin: 0 auto 24px; display: block; box-shadow: 0 14px 32px -12px rgba(255,90,54,.45); animation: drift 5s ease-in-out infinite; }
  @keyframes drift { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-8px) rotate(4deg); } }
  @media (prefers-reduced-motion: reduce) { .mark { animation: none; } }
  h1 { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 72px; margin: 0; letter-spacing: -.02em; color: var(--ember); }
  p { color: var(--muted); font-size: 15px; margin: 10px 0 28px; }
  a.btn { display: inline-flex; align-items: center; gap: 8px; background: var(--ember); color: #2a0800; font-weight: 800; font-size: 13px; padding: 12px 20px; border-radius: 13px; text-decoration: none; }
</style>
</head>
<body>

  </div>
</body>
